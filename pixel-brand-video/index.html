    <script>
      (function makePixelGrid() {
        const overlay = document.getElementById("grid-pixelate-overlay");
        for (let i = 0; i < 16 * 9; i++) {
          const cell = document.createElement("div");
          cell.className = "grid-cell";
          overlay.appendChild(cell);
        }
      })();
      const main = gsap.timeline({ paused: true });
      const cells = "#grid-pixelate-overlay .grid-cell";
      main.set(cells, { scale: 0 }, 0);
      [7.5, 15, 22.5].forEach((cut) => {
        const coverAt = cut - 0.52;
        main.set("#grid-pixelate-overlay", { opacity: 1 }, coverAt);
        main.to(cells, { scale: 1, duration: 0.12, stagger: { amount: 0.38, from: "center" }, ease: "steps(1)" }, coverAt);
        main.to(cells, { scale: 0, duration: 0.12, stagger: { amount: 0.38, from: "edges" }, ease: "steps(1)" }, cut);
        main.set("#grid-pixelate-overlay", { opacity: 0 }, cut + 0.51);
      });
      window.__timelines["main"] = main;
    </script>
